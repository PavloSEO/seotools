name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mcp,cluster,reports]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Type-check the covered surface (issue #31)
        run: |
          # Explicit file list, not `mypy seohead`: passing the package would check
          # every file as a source target (follow_imports=silent only silences
          # imports OUTSIDE these targets) and pull in modules not annotated yet.
          # Extend this list only as a module is brought fully under the checker.
          mypy seohead/models.py seohead/tools/parser.py seohead/tools/robots.py
      - run: pytest --cov=seohead --cov-report=term-missing

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # dev brings pytest, which the boundary check below now runs.
      - run: python -m pip install -e ".[dev,mcp,cluster,reports]"
      - name: Enforce core/interface boundary
        run: |
          # The rule itself lives in tests/test_interface_binding.py, which
          # discovers the core directories from the filesystem instead of
          # naming them. This line used to carry a hand-written list of five
          # of the package's eight directories, and the one it omitted was the
          # only one that violated the rule (#221). Running the test here keeps
          # one definition rather than two that drift.
          pytest tests/test_interface_binding.py -q
      - name: Enforce collector/analyzer boundary
        run: |
          # The collector gathers evidence; the analyzer judges it. They meet
          # only at the exports contract, so neither may import the other.
          if grep -rnE "^\s*from seohead\.sf|^\s*import seohead\.sf" seohead/crawl; then
            echo "::error::seohead/crawl must not import the analyzer"
            exit 1
          fi
          if grep -rnE "^\s*from seohead\.crawl|^\s*import seohead\.crawl" seohead/sf; then
            echo "::error::seohead/sf must not import the collector"
            exit 1
          fi
      - name: Run the synthetic crawl audit
        run: |
          seohead sf run --exports-dir examples/exports --out /tmp/report --tasks
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/report/audit.json").read_text())
          assert data["issues"], "the synthetic crawl stopped producing findings"
          assert len(data["run"]["checks_skipped"]) < 96
          print("issues", len(data["issues"]), "health", data["summary"]["health_score"])
          PY
      - name: Verify CLI and MCP registration
        run: |
          seohead --version
          sf-analyzer --version
          python - <<'PY'
          import asyncio
          from seohead.cli import COMMANDS
          from seohead.servers.handlers import HANDLERS
          from seohead.servers.mcp_server import build_server

          tools = asyncio.run(build_server().list_tools())
          names = {tool.name for tool in tools}
          expected = {f"seo_{name}" for name in HANDLERS}
          assert len(COMMANDS) == len(HANDLERS)
          assert expected <= names, sorted(expected - names)
          assert {"seo_parse", "seo_site_audit", "sf_audit_run"} <= names
          print("registered MCP tools", len(names))
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seohead-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size and smoke-test the slim image
        run: |
          # Printed on every run so a transitive dependency that quietly adds
          # 200 MB is visible in the build log, not discovered months later.
          docker images seohead-tools:ci --format 'slim image size: {{.Size}}'
          docker run --rm seohead-tools:ci --version
          docker run --rm -v "$PWD/examples:/data/examples:ro" seohead-tools:ci \
            sf run --exports-dir /data/examples/exports --out /tmp/report -q
          docker run --rm --entrypoint python seohead-tools:ci -c "
          import asyncio
          from seohead.servers.handlers import HANDLERS
          from seohead.servers.mcp_server import build_server
          tools = asyncio.run(build_server().list_tools())
          names = {tool.name for tool in tools}
          expected = {f'seo_{name}' for name in HANDLERS}
          assert expected <= names, sorted(expected - names)
          assert {'seo_parse', 'seo_site_audit', 'sf_audit_run'} <= names
          print(f'MCP tools available in the slim image: {len(tools)}')
          "
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seohead-tools:ci-full
          build-args: EXTRAS=all
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report image size and smoke-test the full image
        run: |
          # The full image is the documented alternate build target (EXTRAS=all):
          # it must build and actually carry clustering, not just be smaller than
          # nothing to compare against.
          docker images seohead-tools:ci-full --format 'full image size: {{.Size}}'
          docker run --rm seohead-tools:ci-full --version
          docker run --rm --entrypoint python seohead-tools:ci-full -c "
          import sklearn
          from seohead.tools.clusterer import _SKLEARN_OK
          assert _SKLEARN_OK, 'clustering extra did not install correctly'
          print(f'scikit-learn available in the full image: {sklearn.__version__}')
          "
