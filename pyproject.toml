[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seohead-seotools"
version = "3.0.0"
description = "Local-first Python SEO evidence toolkit: analyzes Screaming Frog exports, adds bounded live and infrastructure checks, and produces structured audits, task backlogs, and reports via CLI and local MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavel Barushka" }]
keywords = [
    "seo", "seo-tools", "technical-seo", "screaming-frog", "audit",
    "sitemap", "robots-txt", "broken-links", "hreflang", "redirects",
    "cdn", "cloudflare", "whois", "technology-detection", "backlink-checker",
    "schema-org", "geo", "aeo", "mcp", "model-context-protocol", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

# Core dependencies install in one step. Extras contain only genuinely heavy or
# optional capabilities.
dependencies = [
    "pandas>=2.0,<4",
    "openpyxl>=3.1,<4",
    "lxml>=4.9,<7",
    "jsonschema>=4.0,<5",
    "httpx>=0.27,<1",
    # Without h2, protocol checks would describe the client rather than the server.
    "h2>=4.1,<5",
    "beautifulsoup4>=4.12,<5",
    "defusedxml>=0.7,<1",
    "Pillow>=10.2,<13",
    # SF export encoding detection (seohead/sf/core/loader.py) once utf-8/utf-16
    # both reject the bytes -- a real detector, not a latin-1 catch-all (#160).
    "charset-normalizer>=3.3,<4",
    "pydantic>=2.6,<3",
    # Pydantic requires TypedDict from here below Python 3.12; see seohead/models.py.
    "typing_extensions>=4.7; python_version < '3.12'",
]

[project.optional-dependencies]
sitemap = ["advertools>=0.16,<1", "python-dateutil>=2.8,<3"]
mcp = ["mcp>=1.9,<2"]
render = ["playwright>=1.48,<2"]
reports = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2"]
cluster = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3", "snowballstemmer>=2.2,<4"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<3",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "PyYAML>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
    "twine>=6,<8",
]
all = [
    "advertools>=0.16,<1", "python-dateutil>=2.8,<3",
    "mcp>=1.9,<2",
    "scikit-learn>=1.4,<2", "numpy>=1.26,<3", "snowballstemmer>=2.2,<4",
    "playwright>=1.48,<2",
    "openpyxl>=3.1,<4", "python-docx>=1.1,<2",
]

[project.scripts]
seohead = "seohead.cli:main"
sf-analyzer = "seohead.sf.cli:main"

[project.urls]
Homepage = "https://seohead.tech/seotools"
Portfolio = "https://seohead.tech/about/results"
Repository = "https://github.com/PavloSEO/seotools"
Documentation = "https://github.com/PavloSEO/seotools/tree/main/docs"
Issues = "https://github.com/PavloSEO/seotools/issues"

[tool.setuptools.packages.find]
include = ["seohead*"]

[tool.setuptools.package-data]
"seohead.storage" = ["*.sql"]
"seohead.sf.schema" = ["*.json"]
"seohead.data" = ["*.json"]
"seohead.skills" = ["**/*.md", "**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# Type checking is being rolled out module by module (issue #31), not enabled
# lax everywhere at once: `follow_imports = "silent"` means every module not
# listed below is still used for inference but none of ITS errors can fail CI,
# so adding a new untyped function elsewhere never breaks the build by surprise.
# The overrides below are the enforced allowlist -- the only modules where a
# type error already fails CI. Add a module here only once it is clean under
# its target strictness; never relax coverage back on an already-covered module.
[tool.mypy]
python_version = "3.10"
follow_imports = "silent"
ignore_missing_imports = true

# The new shared TypedDict models: nothing but type declarations, clean under
# full strict from day one.
[[tool.mypy.overrides]]
module = ["seohead.models"]
strict = true

# The two modules whose return shapes now use those models (parser.parse_url /
# parse_html, robots.check_robots). Not yet full `strict` -- BeautifulSoup's
# stubs make a handful of strict-mode checks noisy well beyond this issue's
# slice -- but every def is annotated and a function can no longer quietly
# return `Any` where its signature promises something narrower.
[[tool.mypy.overrides]]
module = ["seohead.tools.parser", "seohead.tools.robots"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
